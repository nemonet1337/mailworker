# wrangler.toml
name = 'mailworker'
main = "src/index.tsx"
compatibility_date = "2026-05-18"

# カスタムドメイン
#routes = [
#  { pattern = "webmail.example.com/*", custom_domain = true }
#]

[vars]
# 受信メールアドレスのドメイン
# Deploy to Cloudflare ボタン: デプロイ画面で自分のドメインに変更できます
MAIL_DOMAIN = "nemonet.work"

# 管理者による新規ユーザー作成を許可するか (デフォルト: "false" = 禁止)
# 有効化: wrangler.toml を "true" に変更して再デプロイ、または
#          Cloudflare ダッシュボード > Workers > 設定 > 変数 で変更
ALLOW_REGISTRATION = "false"

# D1 データベース
# Deploy to Cloudflare ボタン: デプロイ画面で既存 DB の選択 / 新規作成が可能
#   (作成されたリソースの ID で database_id が自動的に書き換えられます)
# 手動セットアップ: wrangler d1 create mail-app-db
#   → 出力された database_id をここに設定してください
[[d1_databases]]
binding        = "DB"
database_name  = "mail-app-db"
database_id    = "cd9065b5-6df6-4f6a-b9e7-e40106c9ace6"
migrations_dir = "migrations"

# R2 バケット (添付ファイル保存)
# Deploy to Cloudflare ボタン: デプロイ画面で既存バケットの選択 / 新規作成が可能
# 手動セットアップ: wrangler r2 bucket create mailworker-bucket
[[r2_buckets]]
binding     = "BUCKET"
bucket_name = "mailworker-bucket"

# Queues — PWA プッシュ通知用 (Workers Paid プランが必要)
# 手動セットアップ: wrangler queues create mailworker-queue
[[queues.producers]]
binding = "MAIL_QUEUE"
queue   = "mailworker-queue"

[[queues.consumers]]
queue             = "mailworker-queue"
max_batch_size    = 10
max_batch_timeout = 5

# VAPID キー (プッシュ通知用) — wrangler secret で設定してください:
#   wrangler secret put VAPID_PUBLIC_KEY
#   wrangler secret put VAPID_PRIVATE_KEY_JWK
#   wrangler secret put VAPID_SUBJECT   (例: mailto:admin@yourdomain.com)
# キーの生成: デプロイ後に /admin/vapid/generate にアクセス

# メール送信 (Cloudflare Email Workers / Email Sending)
# Cloudflare ダッシュボードで Email Routing を有効にしてください
[[send_email]]
name = "SEND_EMAIL"

# 予約送信: 毎分 due を処理 (デプロイ反映に最大 15 分かかる場合あり)
[triggers]
crons = ["* * * * *"]

# レートリミッター (ブルートフォース対策)
# namespace_id はこの Worker 内で一意な任意の正の整数 (ダッシュボードでの事前作成は不要)
[[ratelimits]]
name         = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit  = 5
  period = 60

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[build]
command = "npm run css"
watch_dir = ["src", "styles"]

[[rules]]
type = "Text"
globs = ["**/*.css"]
fallthrough = true
