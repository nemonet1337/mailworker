name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── TypeScript 型チェック (PR / push 共通) ──────────────────────
  typecheck:
    name: TypeScript type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  # ── Cloudflare Workers デプロイ (main ブランチのみ) ────────────
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    needs: typecheck
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # GitHub Actions Variables で wrangler.toml の値を上書き
      - name: Configure wrangler.toml from GitHub Variables
        run: |
          sed -i "s/^name = .*/name = '${{ vars.WORKER_NAME }}'/" wrangler.toml
          sed -i "s/^database_name  = .*/database_name  = \"${{ vars.D1_DATABASE_NAME }}\"/" wrangler.toml
          sed -i "s/^database_id    = .*/database_id    = \"${{ vars.D1_DATABASE_ID }}\"/" wrangler.toml
          sed -i "s/^bucket_name = .*/bucket_name = \"${{ vars.R2_BUCKET_NAME }}\"/" wrangler.toml
          sed -i "s/^MAIL_DOMAIN = .*/MAIL_DOMAIN = \"${{ vars.MAIL_DOMAIN }}\"/" wrangler.toml

      # D1 マイグレーション実行 (デプロイ前にスキーマを最新化)
      - name: Run DB Migrations
        run: npx wrangler d1 migrations apply DB --remote

      # Worker デプロイ
      - name: Deploy Worker
        run: npx wrangler deploy
